[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"
  NPM_FLAGS = "--no-audit --no-fund"

[[redirects]]
  from = "/learn/verilog-interview/"
  to = "/learn/verilog-interview/index.html"
  status = 200

[[redirects]]
  from = "/learn/sva-examples/"
  to = "/learn/sva-examples/index.html"
  status = 200

[[redirects]]
  from = "/learn/rtl-design-exercises/"
  to = "/learn/rtl-design-exercises/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
