name: Fix VHDL starters
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-starters:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix VHDL starters') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch VHDL starters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/main.jsx'); s=p.read_text()
          # Collapse accidental duplicate starter-map declarations from earlier patches.
          s,n=re.subn(r"const vhdlStarters=\{.*?\n\}\nconst vhdlStarters=", "const vhdlStarters=", s, count=1, flags=re.S)
          if n:
            p.write_text(s)
          else:
            print('No duplicate VHDL starter map found')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix VHDL starters'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
