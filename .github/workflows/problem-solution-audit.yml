name: Problem solution audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install HDL simulators
        run: sudo apt-get update && sudo apt-get install -y iverilog ghdl

      - name: Test every advertised problem/language solution
        run: npm run test:problem-solutions
