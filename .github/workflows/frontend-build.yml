name: Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate starter scaffolds
        run: npm run test:starters

      - name: Validate NeetCode theme
        run: npm run test:theme

      - name: Validate problem navigation
        run: npm run test:navigation

      - name: Validate reference solution coverage
        run: npm run test:solution-coverage

      - name: Validate testbench coverage
        run: npm run test:testbench-coverage

      - name: Build production bundle
        run: npm run build
