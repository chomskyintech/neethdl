name: HDL simulation regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rtl-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run all 10 RTL simulations
        run: bash tests/simulation-regression.sh
