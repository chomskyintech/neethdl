name: RTL Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rtl-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Validate simulation catalog
        run: python3 sim/validate_simulation_catalog.py

      - name: Run 10-problem RTL regression
        run: bash sim/run_regression.sh

      - name: Publish regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdlforge-rtl-regression-report
          path: sim/results/
          if-no-files-found: ignore
