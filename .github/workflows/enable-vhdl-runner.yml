name: Enable VHDL GHDL runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-frontend:
    if: ${{ !startsWith(github.event.head_commit.message, 'Enable VHDL GHDL runner') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch VHDL execution path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          s=s.replace("const languages=['All','Verilog','SystemVerilog','VHDL']", "const languages=['All','Verilog','SystemVerilog','VHDL']\nconst RUNNER_URL=(import.meta.env.VITE_RUNNER_URL||'').replace(/\\/$/,'')")
          old="""const run=async()=>{if(editorLanguage==='VHDL'){setResult({pass:false,output:'VHDL editor support is enabled. GHDL execution will be connected next.'});return}setRunning(true);try{const d=await runBrowserSimulation(problem.id,code);setResult({pass:d.passed,output:formatSimulationOutput(d.output,d.passed),waveform:d.waveform})}catch(e){setResult({pass:false,output:e?.message||'Simulator failed.'})}finally{setRunning(false)}};"""
          new="""const run=async()=>{setRunning(true);try{if(editorLanguage==='VHDL'){if(!RUNNER_URL)throw new Error('VHDL simulator is not configured. Set VITE_RUNNER_URL to the HDLForge GHDL runner.');const response=await fetch(`${RUNNER_URL}/run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({problemId:problem.id,source:code,language:'VHDL'})});const d=await response.json();if(!response.ok||!d.ok)throw new Error(d.error||'VHDL runner failed.');setResult({pass:d.passed,output:formatSimulationOutput(d.output,d.passed),waveform:d.waveform})}else{const d=await runBrowserSimulation(problem.id,code);setResult({pass:d.passed,output:formatSimulationOutput(d.output,d.passed),waveform:d.waveform})}}catch(e){setResult({pass:false,output:e?.message||'Simulator failed.'})}finally{setRunning(false)}};"""
          if old not in s: raise SystemExit('Expected VHDL run block not found')
          s=s.replace(old,new)
          s=s.replace('Verilog and SystemVerilog use the browser simulator. VHDL editing is enabled and will use GHDL when its runner is connected.','VHDL uses the GHDL runner. Verilog and SystemVerilog use the browser simulator.')
          p.write_text(s)
          PY
      - name: Commit frontend patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git diff --cached --quiet || git commit -m 'Enable VHDL GHDL runner'
          git push
